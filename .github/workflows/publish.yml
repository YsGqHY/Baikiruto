name: Publish Release

on:
  push:
    branches:
      - main

jobs:
  check-publish:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"[publish]"* ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✅ Commit contains [publish] tag"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping publish (no [publish] tag)"
          fi

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

  build-and-publish:
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew build --no-daemon -x test

      - name: Find built JAR
        id: find_jar
        run: |
          JAR_PATH=$(find plugin/build/libs -name "Baikiruto-*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "❌ JAR file not found!"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT
          echo "✅ Found JAR: $JAR_PATH"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-publish.outputs.version }}
          name: Baikiruto v${{ needs.check-publish.outputs.version }}
          body: |
            ## 🎯 Baikiruto v${{ needs.check-publish.outputs.version }}

            ### 📦 下载
            - **插件文件**: `Baikiruto-${{ needs.check-publish.outputs.version }}.jar`

            ### 📋 安装说明
            1. 下载 JAR 文件
            2. 放入服务器 `plugins` 目录
            3. 重启服务器

            ### 🔧 兼容版本
            - Minecraft: 1.12 - 1.21.11
            - Java: 8+

            ### 📚 文档与支持
            - 交流群: 1084513338
            - 源码仓库: https://github.com/YsGqHY/Baikiruto

            ---

            **完整更新日志请查看提交记录**
          files: ${{ steps.find_jar.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baikiruto-${{ needs.check-publish.outputs.version }}
          path: ${{ steps.find_jar.outputs.jar_path }}
          retention-days: 30

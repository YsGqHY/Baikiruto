name: Publish Release

on:
  push:
    branches:
      - main

jobs:
  check-publish:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == *"[publish]"* ]]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✅ Commit contains [publish] tag"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping publish (no [publish] tag)"
          fi

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

  build-and-publish:
    needs: check-publish
    if: needs.check-publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew build --no-daemon -x test

      - name: Find built JAR
        id: find_jar
        run: |
          JAR_PATH=$(find plugin/build/libs -name "Baikiruto-*.jar" -not -name "*-sources.jar" -not -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "❌ JAR file not found!"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR_PATH)" >> $GITHUB_OUTPUT
          echo "✅ Found JAR: $JAR_PATH"

      - name: Generate release notes
        id: release_notes
        env:
          VERSION: ${{ needs.check-publish.outputs.version }}
        run: |
          git fetch --tags --force

          CURRENT_TAG="v$VERSION"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)

          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:'- %s (`%h`)' --no-merges | grep -v '\[publish\]' || true)
          else
            CHANGELOG=$(git log --pretty=format:'- %s (`%h`)' --no-merges -20 | grep -v '\[publish\]' || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG='- 本次版本未检测到可展示的更新提交。'
          fi

          cat > release-body.md <<EOF
          ## 🎯 Baikiruto v$VERSION

          ### ✨ 更新内容
          $CHANGELOG

          ### 📦 下载
          - **插件文件**: `Baikiruto-$VERSION.jar`

          ### 📋 安装说明
          1. 下载 JAR 文件
          2. 放入服务器 `plugins` 目录
          3. 重启服务器

          ### 🔧 兼容版本
          - Minecraft: 1.12 - 1.21.11
          - Java: 8+
          EOF

          if [ -n "$PREVIOUS_TAG" ]; then
            cat >> release-body.md <<EOF

          ### 🔍 版本对比
          - https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}
          EOF
          fi

          cat >> release-body.md <<EOF

          ### 📚 文档与支持
          - 交流群: 1084513338
          - 源码仓库: https://github.com/YsGqHY/Baikiruto
          EOF

          echo "body_path=release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-publish.outputs.version }}
          name: Baikiruto v${{ needs.check-publish.outputs.version }}
          body_path: ${{ steps.release_notes.outputs.body_path }}
          files: ${{ steps.find_jar.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baikiruto-${{ needs.check-publish.outputs.version }}
          path: ${{ steps.find_jar.outputs.jar_path }}
          retention-days: 30
